- name: 🇯🇵 日本
  type: url-test
  include-all: true
  filter: "^(?=.*(🇯🇵|日本|东京|東京|大阪|大坂|埼玉|(深|沪|滬|呼|京|广|杭|莞|中|辽)日|(?i:Japan|Tokyo|Osaka)|(?<![A-Za-z0-9])(JP|JPN)(?![A-Za-z])))(?!.*(回国|回國|校园|游戏|遊戲|🎮|(?<![A-Za-z0-9])(?i:game)(?![A-Za-z])|套餐|到期|有效期|剩余|已用|过期|官网|官網|网址|官址|客服|工单|订阅|流量|邮箱|群|(?i:expire|traffic|total|used|email))).*$"
