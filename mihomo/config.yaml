# mihomo（Clash Meta）通用模板：github.com/flipped0119/loon
# 用法：把 proxy-providers 里的 url 换成你的机场订阅，其余不用改。地区按节点名自动归组；
# 机场没有的地区组为空，mihomo 会在里面放一个 COMPATIBLE（等同直连），不要在服务分组里手动选空地区。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
    QUIC:
      ports:
      - 443
rule-providers:
