proxy-providers:
  机场:
    type: http
    url: "https://example.com/your-subscription"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🇭🇰 香港
  - 🇹🇼 台湾
  - 🇯🇵 日本
  - 🇸🇬 新加坡
  - 🇺🇸 美国
  - 🇰🇷 韩国
  - 🇲🇾 马来西亚
  - 🇪🇺 欧洲
  - 🖐 手动选择
  - DIRECT
- name: ♻️ 自动选择
  type: url-test
  include-all: true
  filter: "^(?!.*(回国|回國|校园|游戏|遊戲|🎮|(?<![A-Za-z0-9])(?i:game)(?![A-Za-z])|套餐|到期|有效期|剩余|已用|过期|官网|官網|网址|官址|客服|工单|订阅|流量|邮箱|群|(?i:expire|traffic|total|used|email))).*$"
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🖐 手动选择
  type: select
  include-all: true
  filter: "^(?!.*(回国|回國|校园|游戏|遊戲|🎮|(?<![A-Za-z0-9])(?i:game)(?![A-Za-z])|套餐|到期|有效期|剩余|已用|过期|官网|官網|网址|官址|客服|工单|订阅|流量|邮箱|群|(?i:expire|traffic|total|used|email))).*$"
- name: 🇭🇰 香港
  type: url-test
  include-all: true
  filter: "^(?=.*(🇭🇰|港|(?i:Hong ?Kong)|(?<![A-Za-z0-9])(HK|HKG|HKT|HKBN|HGC)(?![A-Za-z])))(?!.*(回国|回國|校园|游戏|遊戲|🎮|(?<![A-Za-z0-9])(?i:game)(?![A-Za-z])|套餐|到期|有效期|剩余|已用|过期|官网|官網|网址|官址|客服|工单|订阅|流量|邮箱|群|(?i:expire|traffic|total|used|email))).*$"
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🇹🇼 台湾
  type: url-test
  include-all: true
  filter: "^(?=.*(🇹🇼|台湾|台灣|台北|新北|彰化|新台|(深|沪|滬|呼|京|广|杭|莞|中|辽)台|🇨🇳.*(台|TW)|(台|TW).*🇨🇳|(?i:Tai ?wan|Taipei)|(?<![A-Za-z0-9])(TW|TWN)(?![A-Za-z])))(?!.*(回国|回國|校园|游戏|遊戲|🎮|(?<![A-Za-z0-9])(?i:game)(?![A-Za-z])|套餐|到期|有效期|剩余|已用|过期|官网|官網|网址|官址|客服|工单|订阅|流量|邮箱|群|(?i:expire|traffic|total|used|email))).*$"
